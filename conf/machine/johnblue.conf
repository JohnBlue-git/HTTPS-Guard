#@TYPE: Machine
#@NAME: JohnBlue HTTPS-Guard Virtual BMC
#@DESCRIPTION: QEMU-based AST2600 machine for HTTPS-Guard integration testing

# Tells BitBake to parse that file and merge its settings into the current config. Because it uses require, parsing fails immediately if the file cannot be found.
# This provides common machine-level OpenBMC defaults such as kernel image type, flash-size default, image-type selection, and initramfs settings.
require conf/machine/include/obmc-bsp-common.inc

# Inherit the full upstream AST2600 EVB configuration:
# linux-aspeed kernel, u-boot-aspeed-sdk, KERNEL_DEVICETREE, AST2600 QEMU
# model support, FLASH_SIZE=65536, SERIAL_CONSOLES, and mctp.inc.
require conf/machine/evb-ast2600.conf

# Disable hardware root of trust — explicit for QEMU development clarity.
SOCSEC_SIGN_ENABLE = "0"

# ---------------------------------------------------------------------------
# QEMU networking configuration
#
# HTTPS-Guard XDP requires a real (paravirtualized) NIC in the guest.
# Two modes are supported:
#
#   SLIRP (default)   — user-mode networking, no XDP support.
#                       Used for simulation-only testing.
#                       SSH:  host:2222 -> BMC:22
#                       HTTPS: host:4433 -> BMC:443
#
#   TAP+BRIDGE        — gives the guest a real virtio-net device that
#                       supports XDP generic mode.  To use it:
#
#                       1. Install bridge-utils and uml-utilities:
#                            sudo apt install bridge-utils uml-utilities
#
#                       2. Create a bridge and TAP device on the host:
#                            sudo ip link add name br0 type bridge
#                            sudo ip tuntap add dev tap0 mode tap user $(whoami)
#                            sudo ip link set tap0 master br0
#                            sudo ip link set tap0 up
#                            sudo ip link set br0 up
#
#                       3. Override QB_NETWORK_OPTION on the bitbake command line:
#                            QB_NETWORK_OPTION = "-netdev tap,id=net0,ifname=tap0,script=no,downscript=no -device virtio-net-pci,netdev=net0,mac=52:54:00:12:34:56"
#                            bitbake obmc-phosphor-image -R <(echo 'QB_NETWORK_OPTION = "-netdev tap,id=net0,ifname=tap0,script=no,downscript=no -device virtio-net-pci,netdev=net0,mac=52:54:00:12:34:56"')
#
# ---------------------------------------------------------------------------

# Port forwarding for QEMU slirp networking (default).
# SSH: host:2222 -> BMC:22 | HTTPS: host:4433 -> BMC:443
QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::4433-:443"
