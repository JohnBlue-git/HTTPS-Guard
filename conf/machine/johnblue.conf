#@TYPE: Machine
#@NAME: JohnBlue HTTPS-Guard Virtual BMC
#@DESCRIPTION: QEMU-based AST2600 machine for HTTPS-Guard integration testing

# Tells BitBake to parse that file and merge its settings into the current config. Because it uses require, parsing fails immediately if the file cannot be found.
# This provides common machine-level OpenBMC defaults such as kernel image type, flash-size default, image-type selection, and initramfs settings.
require conf/machine/include/obmc-bsp-common.inc

# Inherit the full upstream AST2600 EVB configuration:
# linux-aspeed kernel, u-boot-aspeed-sdk, KERNEL_DEVICETREE, AST2600 QEMU
# model support, FLASH_SIZE=65536, SERIAL_CONSOLES, and mctp.inc.
require conf/machine/evb-ast2600.conf

# Disable hardware root of trust — explicit for QEMU development clarity.
SOCSEC_SIGN_ENABLE = "0"

# Port forwarding for QEMU slirp networking.
# SSH: host:2222 -> BMC:22 | HTTPS: host:4433 -> BMC:443
QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::4433-:443"
