# eBPF/XDP kernel configuration for HTTPS-Guard
# Include this fragment in your kernel recipe (e.g., via KERNEL_FEATURES
# or a linux-aspeed bbappend) to enable the kernel features required
# by the https-guardd daemon's eBPF programs.

# Core BPF system support
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_BPF_UNPRIV_DISABLED=y

# BPF iterator / iterator programs
CONFIG_BPF_ITER=y

# BPF preloading
CONFIG_BPF_PRELOAD=y
CONFIG_BPF_PRELOAD_UMD=m

# Ring buffer map (used by https_guard.bpf.c)
CONFIG_BPF_LSM=y

# CONFIG_BPF_LSM alone doesn't register the "bpf" LSM — it depends on
# CONFIG_SECURITY, which isn't otherwise enabled on this board's defconfig.
# Explicitly enable the generic LSM framework and put "bpf" in the active
# chain (no other LSM is needed for this project).
CONFIG_SECURITY=y
CONFIG_LSM="bpf"

# Socket diagnostics — required by the SOCK_DESTROY enforcement path
# (actions/tcp/TcpDestroyer.cpp, via NETLINK_INET_DIAG).
#
# CONFIG_SOCK_DIAG alone is not enough and is misleading on its own: it is
# already pulled in by UNIX_DIAG/PACKET_DIAG, so the netlink family exists and
# *answers* requests. But without INET_DIAG no AF_INET handler is registered,
# so net/core/sock_diag.c's __sock_diag_cmd() returns -ENOENT before it ever
# examines the requested 4-tuple. Every TCP-kill attempt therefore failed
# identically no matter what was asked for, which made the failure look like
# a bad socket lookup rather than a missing feature.
CONFIG_INET_DIAG=y
CONFIG_INET_TCP_DIAG=y
CONFIG_INET_DIAG_DESTROY=y

# XDP (eXpress Data Path) — used by the XDP program to drop
# TLS 1.0/1.1 packets at line rate
CONFIG_NET_XDP=y
CONFIG_XDP_SOCKETS=y

# Enable generic XDP fallback (needed if NIC driver lacks native XDP)
# This allows XDP to work even with virtio NICs in QEMU.
CONFIG_NET_XDP_XMIT=y
CONFIG_BPF_STREAM_PARSER=y

# eBPF trampoline / fentry/fexit support (for modern uprobe usage)
CONFIG_BPF_EVENTS=y
CONFIG_BPF_KPROBE_OVERRIDE=y
CONFIG_BPF_LSM_MMAP_LOCK_MEM=y

# uprobe support — used by https_guard_ssl_write uprobe program
CONFIG_UPROBE_EVENTS=y
CONFIG_UPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_KPROBES=y

# Tracepoint support (used by BPF programs)
CONFIG_FTRACE=y
CONFIG_TRACING=y
CONFIG_FUNCTION_TRACER=y

# Debug info for BPF (useful for development/logging)
CONFIG_DEBUG_INFO_REDUCED=n
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y
CONFIG_PAHOLE_HAS_SPLIT_BTF=y
CONFIG_GDB_SCRIPTS=y

# FPROBE (needed by newer libbpf for kprobe multi links)
CONFIG_FPROBE=y

# Networking stack features expected by the XDP program
CONFIG_NET_SCHED=y
CONFIG_NET_CLS_BPF=y
CONFIG_NET_ACT_BPF=y
CONFIG_NET_CLS_ACT=y
CONFIG_NET_INGRESS=y
