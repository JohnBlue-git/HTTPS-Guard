# HTTPS-Guard Configuration
# This file is sourced by https-guard systemd services via EnvironmentFile.
# Which services are enabled is controlled at build-time via PACKAGECONFIG
# in the bitbake recipe (simulation / daemon / both).
# =============================================================================

# ---------------------------------------------------------------------------
# Daemon (https-guardd) settings
# Only relevant when PACKAGECONFIG includes "daemon" (service:
# https-guard-daemon.service is auto-enabled).
# ---------------------------------------------------------------------------

# Network interface for eBPF XDP attachment.
HTTPS_GUARD_IFACE=eth0

# Path to the BPF object file (installed by the recipe).
HTTPS_GUARD_BPF_OBJ=/usr/share/https-guard/https_guard.bpf.o

# Path to libssl.so for the uprobe attachment point.
HTTPS_GUARD_SSL_LIB=/usr/lib/libssl.so.3

# Hostname this BMC is expected to be addressed as, for SNI mismatch
# detection in the XDP ClientHello parser.
#
# Leave EMPTY (the default) unless this BMC really is reached by exactly one
# hostname. A BMC legitimately answers to any DNS name resolving to it, so
# setting this to the wrong value produces a Warning on every legitimate
# connection. Malformed-SNI detection runs regardless of this setting;
# only hostname *mismatch* checking depends on it.
HTTPS_GUARD_EXPECTED_SNI=

# ---------------------------------------------------------------------------
# Connection-rate detection: inbound TCP SYNs per source address within a
# fixed 10-second window. Crossing this threshold is ACTIONABLE -- the source
# is blocklisted, which drops it on every port, not just 443.
#
# That makes this the safety-critical knob in this file. Set it too low and a
# monitoring system, a dashboard opening many parallel requests, or several
# administrators behind one NAT address will lock themselves out of the BMC
# entirely. It is enforced rather than merely logged because a flood or scan
# is ongoing harm, unlike a weak cipher offer that bmcweb refuses anyway.
#
# Empty or 0 disables the check. The window is fixed at build time; only this
# count is configurable.
#
# The default below was measured, not guessed. On an idle BMC: 0 inbound
# connections per 10s. Ordinary Redfish polling at 2 requests/second: 20. A
# deliberately aggressive parallel dashboard-style burst: 60. 500 therefore
# leaves roughly 8x headroom over the heaviest legitimate load observed,
# while a SYN flood or a port scan runs to thousands and is caught easily.
#
# Raise it if you have several busy clients behind one NAT address, since
# they share a source address and therefore share this budget.
# ---------------------------------------------------------------------------
HTTPS_GUARD_RATE_THRESHOLD=500

# ---------------------------------------------------------------------------
# Slowloris: how many connections one source may hold open at once. This is a
# level, not a rate, so it does not reset with the window -- a source that
# opens connections and then goes silent is exactly the case being caught.
#
# ACTIONABLE, and the false-positive shape is different from the rate rule: a
# legitimate client holding many long-lived connections (a websocket-heavy
# dashboard, a poller with keep-alive) looks identical to a Slowloris. Set
# this above whatever your busiest legitimate client actually holds.
#
# Empty or 0 disables the check.
# ---------------------------------------------------------------------------
HTTPS_GUARD_SLOWLORIS_THRESHOLD=100

# ---------------------------------------------------------------------------
# TLS renegotiation storm: how many TLS handshake records one source may send
# within the same fixed window as the rate rule. Renegotiation is cheap for
# the client and expensive for the server, which is what makes it an attack.
#
# ACTIONABLE. One handshake per connection is normal, so this only trips when
# a source is handshaking far more often than it is making requests.
#
# Empty or 0 disables the check.
# ---------------------------------------------------------------------------
HTTPS_GUARD_RENEG_THRESHOLD=200

# ---------------------------------------------------------------------------
# Simulated event generator settings
# Only relevant when PACKAGECONFIG includes "simulation" (service:
# simulated-event-generator.service is auto-enabled).
# ---------------------------------------------------------------------------

# Interval (seconds) between simulated events.
HTTPS_GUARD_SIMULATE_INTERVAL=15

# ---------------------------------------------------------------------------
# Event bridge settings
# ---------------------------------------------------------------------------

# Event sink mode: dbus | journal | both
# Set at build-time by PACKAGECONFIG (dbus-only / journal-only / event-both)
# via sed substitution in do_install.
HTTPS_GUARD_EVENT_MODE=@@EVENT_MODE@@

# JSON archive path consumed by bridge service (must NOT be inside /var/log/redfish).
HTTPS_GUARD_EVENT_FILE=/var/log/https_guard_events.log

# bmcweb watches this plain-text file for Redfish EventService dispatch.
# Must be a regular file (not a directory).
HTTPS_GUARD_REDFISH_LOG=/var/log/redfish
