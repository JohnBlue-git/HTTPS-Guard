# Event sink mode: dbus | journal | both
HTTPS_GUARD_EVENT_MODE=both

# Simulate eBPF events in QEMU for end-to-end validation.
HTTPS_GUARD_SIMULATE=1
HTTPS_GUARD_SIMULATE_INTERVAL=15

# JSON archive path consumed by bridge service (must NOT be inside /var/log/redfish).
HTTPS_GUARD_EVENT_FILE=/var/log/https_guard_events.log

# bmcweb watches this plain-text file for Redfish EventService dispatch.
# Must be a regular file (not a directory).
HTTPS_GUARD_REDFISH_LOG=/var/log/redfish
